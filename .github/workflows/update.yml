name: Update Stock Data

on:
  schedule:
    - cron: '0 13 * * *' # 매일 한국 시간 밤 10시 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      # 1. 최신 Node.js 24를 지원하는 v5 버전 사용
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      # 2. 최신 Node.js 24를 지원하는 v6 버전 사용
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy requests-cache

      - name: Run Update Script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python update_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f ibd_system.db ]; then
            git add ibd_system.db
            git stash
            git pull origin main --rebase
            git stash pop || echo "No changes to pop"
            git add ibd_system.db
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock data [skip ci]" && git push)
          else
            echo "Database file not found. Skipping commit."
          fi
