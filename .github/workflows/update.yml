name: Update Stock Data

on:
  schedule:
    - cron: '0 13 * * *'  # 매일 UTC 13:00 (한국 시간 밤 10시) 자동 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

permissions:
  contents: write

# 💡 핵심 해결책: GitHub 서버 잔소리(Warning) 끄기
# 구버전 액션들을 강제로 최신 Node.js 24 환경에서 돌리도록 지시합니다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 미국 주식 전체 수집을 위한 넉넉한 타임아웃

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy requests-cache

      - name: Run Update Script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python update_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f ibd_system.db ]; then
            git add ibd_system.db
            git stash
            git pull origin main --rebase
            git stash pop || echo "No changes to pop"
            git add ibd_system.db
            
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 미국 주식 데이터 및 SMR 등급 갱신 [skip ci]" && git push)
          else
            echo "🚨 에러: ibd_system.db 파일이 생성되지 않았습니다."
          fi
