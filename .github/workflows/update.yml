name: Update Stock Data

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python update_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f ibd_system.db ]; then
            git add ibd_system.db
            git stash
            git pull origin main --rebase
            git stash pop || echo "No changes to pop"
            git add ibd_system.db
            
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 미국 주식 데이터 및 SMR 갱신 [skip ci]" && git push)
          else
            echo "🚨 에러: ibd_system.db 파일이 생성되지 않았습니다."
          fi
